<div class="d-flex header-margin flex-column">
    <div class="d-flex justify-content-between ">
        <div class="d-flex flex-column">
            <span class="heading-xxl">
                Connections
            </span>
            <div class="subheading-connection heading-l">
                Your quote will be based on the existing connections, plus the new connections that you
                add.
            </div>
        </div>
        <div class="d-flex flex-column mb-5">
            <div style="display: block;">
                <canvas baseChart [data]="lineChartData" [options]="lineChartOptions"
                    [type]="lineChartType"></canvas>
            </div>
        </div>
    </div>

    <div class="table-report w-100">
        <div class="table-wrapper">
            <table class="table">
                <thead>
                    <th>Connection Type</th>
                    <th>Total existing connections</th>
                    <th>Existing inactive users</th>
                    <th>New connections required</th>
                </thead>
                <tbody>
                    <tr>
                        <td>Voice & Data</td>
                        <td>xxxx</td>
                        <td><input type="text" placeholder="xxx" class="control-box w-25" /></td>
                        <td><input type="text" placeholder="xxx" class="control-box w-25" /></td>
                    </tr>
                    <tr>
                        <td>Voice only</td>
                        <td>xxxx</td>
                        <td><input type="text" placeholder="xxx" class="control-box w-25" /></td>
                        <td><input type="text" placeholder="xxx" class="control-box w-25" /></td>
                    </tr>
                    <tr>
                        <td>Data only</td>
                        <td>xxxx</td>
                        <td><input type="text" placeholder="xxx" class="control-box w-25" /></td>
                        <td><input type="text" placeholder="xxx" class="control-box w-25" /></td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
