<div class="customer-info-wrapper">
    <div class="row">
        <div class="col-12">
            <form [formGroup]="form">
                <div class="vf-card-body">
                    <span class="badge bg-dark">Incomplete</span>
                    <div class="d-flex header-margin flex-column">
                        <span class="heading-xxl">
                            Market & Opportunity Type
                        </span>
                        <div class="subheading heading-l">
                            Specify the OpCo & Opportunity Type
                        </div>
                        <div class="row">
                            <div class="col-md-12">
                                <div class="control-wrapper d-flex align-items-center">
                                    <div class="control-group col-md-3">
                                        <div class="control-label">
                                            Market
                                        </div>
                                        <div class="control">
                                            <mat-select formControlName="market" >
                                                <mat-option value="">Select Market</mat-option>
                                                <mat-option *ngFor="let market of markets" [value]="market.value">
                                                    {{market.label}}</mat-option>
                                            </mat-select>
                                        </div>
                                    </div>
                                    <div class="control-group col-md-4 ml-5">
                                        <div class="control-label">
                                            Oportunity
                                        </div>
                                        <div class="control">
                                            <mat-radio-group (change)="isValidChildForms = false" formControlName="oportunity">
                                                <mat-radio-button class="margin-right-50px"
                                                    [value]="oportunityEnum.New">New
                                                </mat-radio-button>
                                                <mat-radio-button [value]="oportunityEnum.Renew">Renew
                                                </mat-radio-button>
                                            </mat-radio-group>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="d-flex header-margin flex-column">
                        <span class="heading-xxl" [class.disabled]="!form.valid">
                            About customer
                        </span>
                        <div class="subheading heading-l" [class.disabled]="!form.valid"
                            *ngIf="!form.valid">
                            Select at lest one account...
                        </div>
                        <ng-container *ngIf="form.valid && form.get('oportunity')?.value === oportunityEnum.New">
                            <vfpricing-new-customer (emitForm)="isValidChildForms = $event"></vfpricing-new-customer>
                        </ng-container>
                        <ng-container *ngIf="form.valid && form.get('oportunity')?.value === oportunityEnum.Renew">
                            <vfpricing-renew-customer (emitForm)="isValidChildForms = $event">
                            </vfpricing-renew-customer>
                        </ng-container>
                    </div>
                </div>

                <!-- Show In case of Rewnew Only -->
                <div *ngIf="form.valid && form.get('oportunity')?.value === oportunityEnum.Renew" class="vf-card-body mt-4">
                    <accordion [isAnimated]="true">
                        <accordion-group (isOpenChange)="isOpen = $event">
                            <div class="justify-content-between d-flex w-100  shadow-none" accordion-heading
                                type="button">
                                <div class="pull-left heading-xxl float-left">Current usage</div>
                                <span class="d-flex align-items-center">
                                    <img [class.rotate-180]="!isOpen" src="./assets/icons/arrow-up-orange.svg">
                                </span>
                            </div>
                            <accordion-group panelClass="dark mb-4"
                                (isOpenChange)="this.voiceTrendData.isOpen = $event">
                                <div class="justify-content-between d-flex w-100 panelheader-dark shadow-none"
                                    accordion-heading type="button">
                                    <div class="pull-left heading-xl float-left">Voice</div>
                                    <span class="d-flex align-items-center">
                                        <img [class.rotate-180]="!this.voiceTrendData.isOpen"
                                            src="./assets/icons/arrow-up.svg">
                                    </span>
                                </div>
                                <div style="display: block;">
                                    <vfpricing-report-layout [config]="this.voiceTrendData"></vfpricing-report-layout>
                                </div>
                            </accordion-group>

                            <accordion-group panelClass="dark mb-4" (isOpenChange)="this.dataTrend.isOpen = $event">
                                <div class="justify-content-between d-flex w-100 panelheader-dark shadow-none"
                                    accordion-heading type="button">
                                    <div class="pull-left heading-xl float-left">Data</div>
                                    <span class="d-flex align-items-center">
                                        <img [class.rotate-180]="!this.dataTrend.isOpen"
                                            src="./assets/icons/arrow-up.svg">
                                    </span>
                                </div>
                                <div style="display: block;">
                                    <vfpricing-report-layout [config]="this.dataTrend"></vfpricing-report-layout>
                                </div>
                            </accordion-group>

                            <accordion-group panelClass="dark mb-4" (isOpenChange)="this.ctnTrend.isOpen = $event">
                                <div class="justify-content-between d-flex w-100 panelheader-dark shadow-none"
                                    accordion-heading type="button">
                                    <div class="pull-left heading-xl float-left">CTNs</div>
                                    <span class="d-flex align-items-center">
                                        <img [class.rotate-180]="!this.ctnTrend.isOpen"
                                            src="./assets/icons/arrow-up.svg">
                                    </span>
                                </div>
                                <div style="display: block;">
                                    <vfpricing-report-layout [config]="this.ctnTrend"></vfpricing-report-layout>
                                </div>
                            </accordion-group>

                            <accordion-group panelClass="dark mb-4" (isOpenChange)="this.spendTrend.isOpen = $event">
                                <div class="justify-content-between d-flex w-100 panelheader-dark shadow-none"
                                    accordion-heading type="button">
                                    <div class="pull-left heading-xl float-left">Spend</div>
                                    <span class="d-flex align-items-center">
                                        <img [class.rotate-180]="!this.spendTrend.isOpen"
                                            src="./assets/icons/arrow-up.svg">
                                    </span>
                                </div>
                                <div style="display: block;">
                                    <vfpricing-report-layout [config]="this.spendTrend"></vfpricing-report-layout>
                                </div>
                            </accordion-group>
                        </accordion-group>
                    </accordion>
                </div>
                <!-- Show In case of Rewnew Only -->

                <div class="footer">
                    <input type="button" class="btn btn-primary" (click)="submit()" [class.disabled]="!(form.valid && isValidChildForms)" value="Save & Next" />
                </div>
            </form>
        </div>
    </div>
</div>
