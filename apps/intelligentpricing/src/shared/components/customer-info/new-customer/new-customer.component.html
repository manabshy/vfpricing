<div class="subheading heading-l">
    Specify general customer information
</div>
<div class="row">
    <div class="col-md-12">
        <div class="control-wrapper d-flex align-items-center">
            <div class="row w-100">
                <div class="col-md-12">
                    <form [formGroup]="form">
                        <div class="control-wrapper d-flex align-items-center">
                            <div class="control-group col-md-3">
                                <div class="control-label">
                                    Vertical
                                </div>
                                <div class="control">
                                    <mat-select formControlName="vertical">
                                        <mat-option value="">Select Vertical</mat-option>
                                        <mat-option *ngFor="let vertical of verticals" [value]="vertical.value">
                                            {{vertical.label}}</mat-option>
                                    </mat-select>
                                </div>
                            </div>
                            <div class="control-group col-md-4 ml-5">
                                <div class="control-label">
                                    Roaming Zone
                                </div>
                                <div class="control">
                                    <mat-radio-group formControlName="roaming">
                                        <mat-radio-button class="margin-right-50px" [value]="roamingEnum.Local">Local
                                        </mat-radio-button>
                                        <mat-radio-button [value]="roamingEnum.Global">Global
                                        </mat-radio-button>
                                    </mat-radio-group>
                                </div>
                            </div>
                            <div class="control-group col-md-3 ml-5">
                                <div class="control-label">
                                    Usage Level
                                </div>
                                <div class="control">
                                    <mat-radio-group formControlName="usage">
                                        <mat-radio-button class="margin-right-50px" [value]="usageEnum.Account">Account
                                        </mat-radio-button>
                                        <mat-radio-button  [value]="usageEnum.User">User
                                        </mat-radio-button>
                                    </mat-radio-group>
                                </div>
                            </div>
                        </div>
                    </form>
                  
                </div>
            </div>
        </div>
    </div>
</div>
