<vfpricing-layout>
    <div class="layout">
        <div class="stepper-wrapper">
            <vfpricing-stepper [selectedIndex]="this.selectedStep" [stepperConfig]="stepper" (clickEmit)="setStep($event)"></vfpricing-stepper>   
        </div>
        <div class="stepper-panel" [ngSwitch]="selectedStep">
            <vfpricing-customer-info *ngSwitchCase="0" (moveNext)="moveNext($event)"></vfpricing-customer-info>
            <vfpricing-investment *ngSwitchCase="1"></vfpricing-investment>
            <vfpricing-configure *ngSwitchCase="2"></vfpricing-configure>
            <vfpricing-tariff-recommendation  *ngSwitchCase="3"></vfpricing-tariff-recommendation>
        </div>
    </div>
</vfpricing-layout>
