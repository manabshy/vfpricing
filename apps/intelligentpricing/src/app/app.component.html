<vfpricing-layout>
    <div class="layout">
        <div class="stepper-wrapper">
            <vfpricing-stepper [stepperConfig]="stepper" (clickEmit)="setStep($event)"></vfpricing-stepper>   
        </div>
        <div class="stepper-panel" [ngSwitch]="selectedStep">
            <vfpricing-customer-info *ngSwitchCase="0"></vfpricing-customer-info>
            <vfpricing-investment *ngSwitchCase="1"></vfpricing-investment>
        </div>
    </div>
</vfpricing-layout>
