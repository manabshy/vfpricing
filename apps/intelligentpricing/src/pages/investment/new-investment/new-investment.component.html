<div class="d-flex header-margin flex-column">
    <div class="d-flex justify-content-between ">
        <div class="d-flex flex-column">
            <span class="heading-xxl">
                Connections
            </span>
            <div class="subheading-connection heading-l mb-5">
                Add the number of new connection required
            </div>
        </div>
    </div>

    <div class="table-report w-100">
        <div class="table-wrapper">
            <table class="table">
                <thead>
                    <th>Connection Type</th>
                    <th>
                        <div class="d-flex align-items-center">
                            <div>
                                No. of connections
                            </div>
                            <div class="ml-3">
                                <vfpricing-alert alertType="info" [showTitle]="false" [clickEnable]="false">
                                </vfpricing-alert>
                            </div>
                        </div>
                    </th>
                </thead>
                <tbody>
                    <tr>
                        <td>Voice & Data</td>
                        <td><input type="text" placeholder="xxx" class="control-box w-25" /></td>
                    </tr>
                    <tr>
                        <td>Voice only</td>
                        <td><input type="text" placeholder="xxx" class="control-box w-25" /></td>
                    </tr>
                    <tr>
                        <td>Data only</td>
                        <td><input type="text" placeholder="xxx" class="control-box w-25" /></td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
