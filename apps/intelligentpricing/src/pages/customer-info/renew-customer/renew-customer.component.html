<div class="subheading heading-l">
    Select at least one account...
</div>
<div class="row">
    <div class="col-md-12">
        <form>
            <div class="control-wrapper d-flex align-items-center">
                <div class="control-group col-lg-3 col-md-4">
                    <div class="control-label">
                        Search
                    </div>
                    <div class="control position-relative">

                        <div class="btn-group w-100 position-relative d-flex flex-column">
                                <input type="text" class="control-box" placeholder="Name, Account No,.." aria-label="Number"
                                     [formControl]="accountName" [matAutocomplete]="auto">
                                     <span class="search-box">
                                        <img src="./assets/icons/search.svg">
                                    </span>
                                     <mat-autocomplete #auto="matAutocomplete">
                                    <mat-option *ngFor="let data of customer">
                                        <mat-checkbox 
                                            [ngModelOptions]="{standalone: true}"
                                            (click)="$event.stopPropagation()"
                                            (ngModelChange)="updateAllComplete(data)" 
                                            [(ngModel)]="data.checked">
                                            {{data.customer_name}}
                                        </mat-checkbox>
                                    </mat-option>
                                </mat-autocomplete>
                            <div>
                                <div (click)="updateAllComplete(select)" *ngFor="let select of selectedCustomers"
                                    class="selected-chips">
                                    {{select.customer_name}}
                                    <img role="button" src="./assets/icons/cross.svg" />
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="control-group warning-box">
                    <div class="control-label">
                    </div>
                    <div class="control position-relative">
                        <vfpricing-alert [alertType]="'warning'">
                            Some slections may not have full 12 months usage/spend history which can
                            affect accuracy. Please use the
                            “configure usage” if alternations are required.
                        </vfpricing-alert>
                    </div>
                </div>
            </div>
        </form>
    </div>
</div>
