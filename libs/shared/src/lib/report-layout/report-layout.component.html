<div style="display: block;">
    <canvas baseChart *ngIf="config" [width]="'400'" [height]="'100'" [datasets]="config.graphData.chartData.datasets"
        [labels]="config.graphData.labels" [options]="config.graphData.options" [legend]="config.graphData.chartLegend"
        [type]="config.graphData.chartType">
    </canvas>
    <div class="table-report w-100">
        <div class="table-heading">Summary</div>
        <div class="table-wrapper">
            <table class="table">
                <thead>
                    <th *ngFor="let col of config.tableData?.column">{{col.label}}</th>
                </thead>
                <tbody>
                    <ng-container>
                        <tr *ngFor="let row of config.tableData.rowData">
                            <ng-container *ngFor="let col of config.tableData.column">
                                <td *ngIf="col.label">
                                    <div class="d-flex align-items-center" *ngIf="col.attribute === 'change'"> {{row[col.attribute]}}
                                        <img class="status-icons ml-2" *ngIf="row.diff === 'UP'" src="./assets/icons/arrow-up-sign.svg">
                                        <img class="status-icons ml-2" *ngIf="row.diff === 'DOWN'" src="./assets/icons/arrow-down-sign.svg">
                                        <img class="status-icons ml-2" *ngIf="row.diff === 'NO_CHANGE'" src="./assets/icons/minus.svg">
                                    </div>
                                    <div *ngIf="col.attribute !== 'change'"> {{row[col.attribute]}}</div>
                                </td>
                            </ng-container>
                        </tr>
                    </ng-container>
                </tbody>
            </table>
        </div>
    </div>
</div>
