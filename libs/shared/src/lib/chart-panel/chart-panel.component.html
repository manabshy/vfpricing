<div class="chart-panel">
    <div class="heading">National</div>
    <img src="./assets/icons/open.svg" (click)="openModalWithClass(maximize, 'gray modal-lg')" class="open-icon" />
    <div class="labels-wrapper">
        <div class="d-flex align-items-center justify-content-center">
            <span class="actual-dot mr-1"></span>
            <span class="actual">Actual</span>
        </div>
        <div class="d-flex align-items-center ml-3 justify-content-center">
            <span class="forecast-dot mr-1"></span>
            <span class="forecast">Forecast</span>
        </div>
    </div>
    <canvas baseChart [data]="lineChartData" [options]="lineChartOptions" [type]="lineChartType"></canvas>
    <div class="chat-data">
        <div class="left-side">
            <div class="lbl-heading">Actual</div>
            <div class="lbl-data">
                <span class="minutes-data">XXXX</span>
                <span class="minutes-lbl">mins</span>
            </div>
        </div>
        <div class="right-side">
            <div class="lbl-heading">Forecast</div>
            <div class="lbl-data">
                <span class="minutes-data">XXXX</span>
                <span class="minutes-lbl">mins</span>
            </div>
        </div>
    </div>
    <span class="edit-section" (click)="openEditModal(editOption)" role="button">Edit</span>
</div>

<ng-template #maximize=>
    <div class="modal-body">
        <div class="chart-panel">
            <div class="heading">National</div>
            <img src="./assets/icons/minmize.svg" (click)="closeModal()" class="open-icon" />
            <div class="labels-wrapper">
                <div class="d-flex align-items-center justify-content-center">
                    <span class="actual-dot mr-1"></span>
                    <span class="actual">Actual</span>
                </div>
                <div class="d-flex align-items-center ml-3 justify-content-center">
                    <span class="forecast-dot mr-1"></span>
                    <span class="forecast">Forecast</span>
                </div>
            </div>
            <canvas style="height: 60%; width: 60%;" baseChart [data]="lineChartData" [options]="lineChartOptions"
                [type]="lineChartType"></canvas>
            <div class="chat-data">
                <div class="left-side">
                    <div class="lbl-heading">Actual</div>
                    <div class="lbl-data">
                        <span class="minutes-data">XXXX</span>
                        <span class="minutes-lbl">mins</span>
                    </div>
                </div>
                <div class="right-side">
                    <div class="lbl-heading">Forecast</div>
                    <div class="lbl-data">
                        <span class="minutes-data">XXXX</span>
                        <span class="minutes-lbl">mins</span>
                    </div>
                </div>
            </div>
            <span class="edit-section" (click)="openEditModal(editOption)" role="button">Edit</span>
        </div>
    </div>
</ng-template>


<ng-template #editOption>
    <div class="modal-body">
        <div (click)="closeModal()" class="close-btn">
            <img src="./assets/icons/cross-white.svg" alt="">
        </div>
        <div class="chart-panel">
            <div class="heading">Update National Usage</div>
            <div class="labels-wrapper mt-2">
                <div class="d-flex align-items-center justify-content-center">
                    <span class="actual-dot mr-1"></span>
                    <span class="actual">Actual</span>
                </div>
                <div class="d-flex align-items-center ml-3 justify-content-center">
                    <span class="forecast-dot mr-1"></span>
                    <span class="forecast">Forecast</span>
                </div>
            </div>
            <div class="chat-data mt-2 mb-2">
                <div class="left-side">
                    <div class="lbl-heading">Actual</div>
                    <div class="lbl-data">
                        <span class="minutes-data">XXXX</span>
                        <span class="minutes-lbl">mins</span>
                    </div>
                </div>
                <div class="right-side">
                    <div class="lbl-heading">Forecast</div>
                    <div class="lbl-data">
                        <span class="minutes-data">XXXX</span>
                        <span class="minutes-lbl">mins</span>
                    </div>
                </div>
            </div>
            <div style="display: block;">
                <canvas height="50rem" baseChart [data]="lineChartData" [options]="lineChartOptions"
                    [type]="lineChartType"></canvas>
            </div>
            <div class="d-flex align-items-center justify-content-end mt-3 mb-3">
                <input type="button" class="btn btn-link" value="Reset Usage" />
            </div>
            <div class="table-edit">
                <table>
                    <thead>
                        <th>Jan</th>
                        <th>Feb</th>
                        <th>Mar</th>
                        <th>Apr</th>
                        <th>May</th>
                        <th>Jun</th>
                        <th>Jul</th>
                        <th>Aug</th>
                        <th>Sep</th>
                        <th>Oct</th>
                        <th>Nov</th>
                        <th>Dec</th>
                    </thead>
                    <tbody>
                        <td>
                            <input type="text" class="control-box" placeholder="XXXX">
                        </td>
                        <td>
                            <input type="text" class="control-box" placeholder="XXXX">
                        </td>
                        <td>
                            <input type="text" class="control-box" placeholder="XXXX">
                        </td>
                        <td>
                            <input type="text" class="control-box" placeholder="XXXX">
                        </td>
                        <td>
                            <input type="text" class="control-box" placeholder="XXXX">
                        </td>
                        <td>
                            <input type="text" class="control-box" placeholder="XXXX">
                        </td>
                        <td>
                            <input type="text" class="control-box" placeholder="XXXX">
                        </td>
                        <td>
                            <input type="text" class="control-box" placeholder="XXXX">
                        </td>
                        <td>
                            <input type="text" class="control-box" placeholder="XXXX">
                        </td>
                        <td>
                            <input type="text" class="control-box" placeholder="XXXX">
                        </td>
                        <td>
                            <input type="text" class="control-box" placeholder="XXXX">
                        </td>
                        <td>
                            <input type="text" class="control-box" placeholder="XXXX">
                        </td>
                    </tbody>
                </table>
            </div>

            <div class="mt-5 mb-3 d-flex align-text-center justify-content-end">
                <input type="button" class="btn btn-primary" (click)="closeModal()" value="Cancel">
                <input type="button" class="btn btn-primary" (click)="closeModal()" value="Save">
            </div>
        </div>
    </div>
</ng-template>
